<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact — Shailesh Bhadra</title>
<meta name="description" content="Get in touch with Shailesh Bhadra — SEO, e-commerce, analytics and AI-driven digital problem solving.">
<link rel="canonical" href="https://shaileshbhadra.com/contact.html">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<header class="site-header" id="site-header"></header>

<main>
  <section class="section">
    <div class="container contact-grid">
      <div>
        <div class="eyebrow">Contact</div>
        <h1 style="font-size:clamp(30px,4vw,42px);margin-top:16px;">Let's talk about the problem, not the pitch.</h1>
        <p class="prose" style="margin-top:16px;">Open to remote SEO, analytics and growth roles, and select project work. Reach out directly or use the form.</p>
        <div class="contact-list" id="contact-details"></div>
      </div>
      <div>
        <form id="contact-form">
          <div class="field">
            <label for="f-name">Name</label>
            <input type="text" id="f-name" name="name" required>
          </div>
          <div class="field">
            <label for="f-email">Email</label>
            <input type="email" id="f-email" name="email" required>
          </div>
          <div class="field">
            <label for="f-message">Message</label>
            <textarea id="f-message" name="message" required></textarea>
          </div>
          <button type="submit" class="btn btn--primary">Send message</button>
        </form>
      </div>
    </div>
  </section>
</main>

<footer class="site-footer" id="site-footer"></footer>

<script src="assets/js/data.js"></script>
<script src="assets/js/main.js"></script>
<script>
  renderHeader("contact.html");
  renderFooter();
  initContactForm();

  document.getElementById("contact-details").innerHTML = `
    <div class="contact-row"><span class="k">Email</span><span class="v"><a href="mailto:${PROFILE.email}">${PROFILE.email}</a></span></div>
    <div class="contact-row"><span class="k">Phone</span><span class="v">${PROFILE.phone}</span></div>
    <div class="contact-row"><span class="k">LinkedIn</span><span class="v"><a href="${PROFILE.linkedin}" target="_blank" rel="noopener">${PROFILE.linkedin.replace('https://www.','')}</a></span></div>
    <div class="contact-row"><span class="k">Location</span><span class="v">${PROFILE.location}</span></div>
  `;
</script>
</body>
</html>
