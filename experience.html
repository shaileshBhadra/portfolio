<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Experience — Shailesh Bhadra</title>
<meta name="description" content="Shailesh Bhadra's professional timeline — 9+ years across SEO, analytics and performance marketing roles.">
<link rel="canonical" href="https://shaileshbhadra.com/experience">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/assets/favicon/favicon-32x32.png" type="image/png" sizes="32x32">
<link rel="icon" href="/assets/favicon/favicon-16x16.png" type="image/png" sizes="16x16">
<link rel="apple-touch-icon" href="/assets/favicon/apple-touch-icon.png">
<link rel="manifest" href="/assets/favicon/site.webmanifest">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<header class="site-header" id="site-header"></header>

<main>
  <section class="section--tight">
    <div class="container">
      <div class="eyebrow">Experience</div>
      <h1 style="font-size:clamp(30px,4vw,44px);margin-top:16px;max-width:760px;">9+ years, one thread: measurable growth.</h1>
    </div>
  </section>

  <section class="section" style="padding-top:0;">
    <div class="container">
      <div class="timeline" id="experience-timeline"></div>
    </div>
  </section>

  <section class="section section--alt">
    <div class="container">
      <div class="eyebrow">Education</div>
      <div id="education-list" style="margin-top:16px;max-width:520px;"></div>
    </div>
  </section>
</main>

<footer class="site-footer" id="site-footer"></footer>

<script src="assets/js/data.js"></script>
<script src="assets/js/main.js"></script>
<script>
(async () => {
  renderHeader("/experience");
  renderFooter();
  const site = await loadSiteContent();
  renderTimeline("experience-timeline", site.experience);

  document.getElementById("education-list").innerHTML = EDUCATION.map(e => `
    <div style="margin-bottom:16px;">
      <div style="font-size:15px;">${e.degree}</div>
      <div style="font-family:var(--font-mono);font-size:12.5px;color:var(--ink-faint);margin-top:4px;">${e.school} · ${e.year}</div>
    </div>`).join("");

  initScrollReveal();
})();
</script>
</body>
</html>
