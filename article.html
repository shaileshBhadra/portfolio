<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Article — Shailesh Bhadra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<header class="site-header" id="site-header"></header>

<main>
  <section class="section" id="article-detail"></section>
</main>

<footer class="site-footer" id="site-footer"></footer>

<script src="assets/js/data.js"></script>
<script src="assets/js/main.js"></script>
<script>
  renderHeader("knowledge.html");
  renderFooter();

  const params = new URLSearchParams(window.location.search);
  const slug = params.get("slug");
  const a = ARTICLES.find(x => x.slug === slug) || ARTICLES[0];
  document.title = `${a.title} — Shailesh Bhadra`;
  document.getElementById("article-detail").innerHTML = `
    <div class="container">
      <a class="back-link" href="knowledge.html">← All articles</a>
      <div class="eyebrow" style="margin-top:20px;">${a.category}</div>
      <h1 style="font-size:clamp(28px,4vw,42px);margin-top:14px;max-width:760px;">${a.title}</h1>
      <div class="detail-meta-row"><span>${a.date || "[ADD DATE]"}</span><span>${a.readingTime || "[ADD READ TIME]"}</span></div>
      <div class="case-block" style="border-top:none;padding-left:0;">
        <p class="placeholder-note">[ADD ARTICLE CONTENT — this template is ready for full copy, a table of contents and related articles once written.]</p>
      </div>
    </div>`;
</script>
</body>
</html>
